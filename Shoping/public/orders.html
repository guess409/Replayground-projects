<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesanan - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }
    button, input, textarea { font: inherit; }
    .wrap { max-width: 650px; margin: auto; }
    .hidden { display: none !important; }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .header-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }

    /* KARTU */
    .card {
      padding: 20px 18px;
      margin-bottom: 16px;
      border: 1px solid #347653;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow: 0 6px 0 #06100A, 0 14px 28px #00000060, inset 0 1px 0 #FFFFFF12;
    }
    h1 {
      margin: 0 0 6px;
      color: #F0FDF4;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }
    h2 { margin: 0 0 4px; color: #F0FDF4; font-size: 17px; }
    h3 { margin: 0 0 10px; color: #D8E9DE; font-size: 14px; }
    .subtitle { margin: 0; color: #A9BDB0; font-size: 13px; line-height: 1.6; }
    .center { text-align: center; }
    .big-icon { margin-bottom: 10px; color: #6EE7B7; font-size: 40px; }

    /* TOMBOL */
    .btn {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid #FFFFFF40;
      background: #FFFFFF10;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main {
      border: 1px solid #6EE7B7;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      box-shadow: 0 4px 0 #065F46, inset 0 1px 0 #FFFFFF90;
    }
    .btn-main:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #065F46; }
    .btn-danger { border-color: #F8717180; background: #F8717120; color: #FCA5A5; }
    .btn-small { padding: 8px 12px; font-size: 12px; }
    .aksi { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .aksi .btn { flex: 1; min-width: 130px; }

    /* FORM */
    .field-label { display: block; margin: 15px 0 7px; color: #D8E9DE; font-size: 12px; font-weight: bold; }
    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input, .input-box textarea {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    .input-box textarea { resize: vertical; min-height: 80px; }
    .input-box:focus-within { border-color: #6EE7B7; box-shadow: 0 0 0 3px #34D39915; }
    .input-box.invalid { border-color: #F87171; box-shadow: 0 0 0 3px #F8717115; }
    input::placeholder, textarea::placeholder { color: #708779; }
    .error { min-height: 16px; margin: 6px 2px 0; color: #FCA5A5; font-size: 11px; }

    /* GAMBAR */
    .thumb, .thumb-kosong {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #303A35;
    }
    .thumb-kosong { display: grid; place-items: center; color: #6EE7B7; font-size: 22px; }

    /* STATUS PESANAN */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #FFFFFF30;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }
    .st-menunggu  { color: #FCD34D; border-color: #FCD34D66; background: #FCD34D18; }
    .st-diproses  { color: #93C5FD; border-color: #93C5FD66; background: #93C5FD18; }
    .st-dikirim   { color: #6EE7B7; border-color: #6EE7B788; background: #34D39922; }
    .st-selesai   { color: #A7F3D0; border-color: #A7F3D066; background: #10B98133; }
    .st-dibatalkan{ color: #FCA5A5; border-color: #F8717180; background: #F8717120; }

    .status { margin: 14px 4px; color: #B8D2C2; font-size: 13px; text-align: center; }
    .status:empty { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: #0F2A1E;
      color: #D1FAE5;
      font-size: 13px;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px #00000080;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      flex: 1; padding: 12px 10px;
      border: 1px solid #365746; border-radius: 12px;
      background: #17251D; color: #C5E8D2; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .tab.aktif { border-color: #6EE7B7; background: linear-gradient(180deg, #6EE7B7, #10B981); color: #052E22; }
    .tab .hitung {
      display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 6px;
      border-radius: 10px; background: #FCD34D; color: #3B2F00; font-size: 11px;
    }
    .pesanan {
      display: flex; gap: 12px; width: 100%;
      padding: 12px; margin-bottom: 10px;
      border: 1px solid #2D4538; border-radius: 14px;
      background: #131D17; color: #E5F3EA; text-align: left; cursor: pointer;
    }
    .pesanan:active { transform: translateY(2px); }
    .pesanan .info { flex: 1; min-width: 0; }
    .pesanan .atas { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pesanan .no { color: #A9BDB0; font-size: 12px; font-weight: bold; }
    .pesanan .nama { margin: 6px 0 0; overflow: hidden; color: #F0FDF4; font-size: 14px; font-weight: bold; text-overflow: ellipsis; white-space: nowrap; }
    .pesanan .sub { margin: 3px 0 0; color: #71877A; font-size: 11px; }
    .pesanan .total { margin: 6px 0 0; color: #6EE7B7; font-size: 13px; font-weight: bold; }

  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <div class="header-links">
      <a href="jual.html" class="back"><i class="fa fa-tags"></i> Jualan Saya</a>
      <a href="welcome.html" class="back"><i class="fa fa-home"></i> Beranda</a>
    </div>
  </header>


  <div class="card center" id="gate">
    <div class="big-icon"><i class="fa fa-list-alt"></i></div>
    <h2 id="gateTitle">Memuat pesanan...</h2>
    <p class="subtitle" id="gateText"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1>Pesanan <span>Saya</span></h1>
      <p class="subtitle">Pantau pembelianmu, atau proses pesanan yang masuk ke tokomu.</p>
    </div>

    <div class="tabs">
      <button class="tab aktif" id="tabBeli">Pembelian Saya</button>
      <button class="tab" id="tabJual">Pesanan Masuk<span class="hitung hidden" id="hitungJual"></span></button>
    </div>

    <p class="status" id="status"></p>
    <div id="daftar"></div>
  </div>


</div>

<div class="toast hidden" id="toast"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };

  function rupiah(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }

  function toast(pesan) {
    const t = $("toast");
    t.textContent = pesan;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.add("hidden"); }, 2600);
  }

  async function api(url, opsi) {
    const res = await fetch(url, opsi);
    let data = {};
    try { data = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) {
      const err = new Error(data.error || "Terjadi kesalahan.");
      err.field = data.field;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function jsonOpsi(method, body) {
    return {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
  }

  function elemenKosong() {
    const d = document.createElement("div");
    d.className = "thumb-kosong";
    d.innerHTML = '<i class="fa fa-image"></i>';
    return d;
  }

  function elemenThumb(nama, alt) {
    if (!nama) return elemenKosong();
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = alt || "";
    img.src = "/uploads/" + encodeURIComponent(nama);
    img.onerror = function () { img.replaceWith(elemenKosong()); };
    return img;
  }

  function waktu(t) {
    return new Date(t * 1000).toLocaleString("id-ID", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function durasi(detik) {
    if (detik < 60) return detik + " detik";
    const menit = Math.round(detik / 6) / 10;   // 1 angka di belakang koma
    return menit + " menit";
  }

  const LABEL_STATUS = {
    menunggu: "Menunggu penjual",
    diproses: "Diproses",
    dikirim: "Dalam pengiriman",
    selesai: "Selesai",
    dibatalkan: "Dibatalkan"
  };

  function badgeStatus(status) {
    const b = document.createElement("span");
    b.className = "badge st-" + status;
    b.textContent = LABEL_STATUS[status] || status;
    return b;
  }


  let dataBeli = [];
  let dataJual = [];
  let tabAktif = "beli";

  function kartu(o, sebagaiPenjual) {
    const b = document.createElement("button");
    b.className = "pesanan";
    b.addEventListener("click", function () { window.location.href = "order.html?id=" + o.id; });

    const info = document.createElement("div");
    info.className = "info";

    const atas = document.createElement("div");
    atas.className = "atas";
    const no = document.createElement("span");
    no.className = "no";
    no.textContent = "Pesanan #" + o.id;
    atas.append(no, badgeStatus(o.status));

    const nama = document.createElement("p");
    nama.className = "nama";
    nama.textContent = o.first_item + (o.more_items > 0 ? " +" + o.more_items + " lainnya" : "");

    const sub = document.createElement("p");
    sub.className = "sub";
    sub.textContent = (sebagaiPenjual ? "Pembeli: " + o.buyer : "Penjual: " + o.seller) +
      " · " + o.item_count + " barang · " + waktu(o.created_at);

    const total = document.createElement("p");
    total.className = "total";
    total.textContent = rupiah(o.total);

    info.append(atas, nama, sub, total);
    b.append(elemenThumb(o.first_image, o.first_item), info);
    return b;
  }

  function tampil() {
    const jual = tabAktif === "jual";
    const data = jual ? dataJual : dataBeli;
    const box = $("daftar");
    box.innerHTML = "";

    $("tabBeli").classList.toggle("aktif", !jual);
    $("tabJual").classList.toggle("aktif", jual);

    $("status").textContent = data.length ? "" : (jual
      ? "Belum ada pesanan masuk."
      : "Kamu belum punya pesanan. Yuk belanja dulu!");
    data.forEach(function (o) { box.appendChild(kartu(o, jual)); });
  }

  $("tabBeli").addEventListener("click", function () { tabAktif = "beli"; tampil(); });
  $("tabJual").addEventListener("click", function () { tabAktif = "jual"; tampil(); });

  async function mulai() {
    try {
      const me = await api("/api/me");
      if (!me.user) { window.location.href = "signin.html"; return; }
      dataBeli = await api("/api/orders");
      dataJual = await api("/api/orders?as=seller");
    } catch (e) {
      $("gateTitle").textContent = "Pesanan tidak bisa dimuat";
      $("gateText").textContent = "Pastikan python app.py jalan dan buka lewat http://127.0.0.1:5000";
      return;
    }

    $("gate").classList.add("hidden");
    $("panel").classList.remove("hidden");

    const baru = dataJual.filter(function (o) { return o.status === "menunggu"; }).length;
    if (baru > 0) {
      $("hitungJual").textContent = baru;
      $("hitungJual").classList.remove("hidden");
    }

    if (new URLSearchParams(window.location.search).get("tab") === "jual") tabAktif = "jual";
    tampil();
  }

  mulai();

</script>

</body>
</html>
