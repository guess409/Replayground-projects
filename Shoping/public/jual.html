<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jualan Saya - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }

    button, input, textarea { font: inherit; }

    .wrap { max-width: 650px; margin: auto; }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }

    /* KARTU */
    .card {
      position: relative;
      padding: 20px 18px;
      margin-bottom: 16px;
      border: 1px solid #347653;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow: 0 6px 0 #06100A, 0 14px 28px #00000060, inset 0 1px 0 #FFFFFF12;
    }

    h1 {
      margin: 0 0 6px;
      color: #F0FDF4;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }
    h2 { margin: 0 0 4px; color: #F0FDF4; font-size: 17px; }

    .subtitle {
      margin: 0;
      color: #A9BDB0;
      font-size: 13px;
      line-height: 1.6;
    }

    .center { text-align: center; }
    .center .big-icon {
      font-size: 40px;
      color: #6EE7B7;
      margin-bottom: 10px;
    }

    /* TOMBOL */
    .btn {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid #FFFFFF40;
      background: #FFFFFF10;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-main {
      border: 1px solid #6EE7B7;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      box-shadow: 0 4px 0 #065F46, inset 0 1px 0 #FFFFFF90;
    }
    .btn-main:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #065F46;
    }

    .btn-danger {
      border-color: #F8717180;
      background: #F8717120;
      color: #FCA5A5;
    }

    .btn-small { padding: 8px 12px; font-size: 12px; }

    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 20px 0 14px;
    }

    /* FORM */
    .field-label {
      display: block;
      margin: 15px 0 7px;
      color: #D8E9DE;
      font-size: 12px;
      font-weight: bold;
    }
    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input, .input-box textarea {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    .input-box textarea { resize: vertical; min-height: 80px; }
    .input-box:focus-within {
      border-color: #6EE7B7;
      box-shadow: 0 0 0 3px #34D39915;
    }
    .input-box.invalid {
      border-color: #F87171;
      box-shadow: 0 0 0 3px #F8717115;
    }
    input::placeholder, textarea::placeholder { color: #708779; }

    .error {
      min-height: 16px;
      margin: 6px 2px 0;
      color: #FCA5A5;
      font-size: 11px;
    }

    /* GAMBAR */
    .preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }
    .thumb, .thumb-kosong {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #303A35;
    }
    .thumb-kosong {
      display: grid;
      place-items: center;
      color: #6EE7B7;
      font-size: 24px;
    }
    .file-input { color: #A9BDB0; font-size: 12px; max-width: 100%; }
    .hint { margin: 6px 0 0; color: #71877A; font-size: 11px; }

    .form-actions { display: flex; gap: 10px; margin-top: 20px; }
    .form-actions .btn { flex: 1; }

    /* DAFTAR PRODUK */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #2D4538;
      border-radius: 14px;
      background: #131D17;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-nama {
      margin: 0;
      overflow: hidden;
      color: #F0FDF4;
      font-size: 14px;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-harga { margin: 3px 0 0; color: #6EE7B7; font-size: 12px; }
    .item-actions { display: flex; flex-direction: column; gap: 6px; }

    .status {
      margin: 14px 4px;
      color: #B8D2C2;
      font-size: 13px;
      text-align: center;
    }
    .status:empty { display: none; }
    .hidden { display: none !important; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: #0F2A1E;
      color: #D1FAE5;
      font-size: 13px;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px #00000080;
    }
  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <a href="orders.html?tab=jual" class="back"><i class="fa fa-list-alt"></i> Pesanan Masuk</a>
    <a href="cart.html" class="back"><i class="fa fa-shopping-cart"></i> Keranjang</a>
    <a href="welcome.html" class="back"><i class="fa fa-arrow-left"></i> Beranda</a>
  </header>

  <!-- Status awal / akses ditolak -->
  <div class="card center" id="gate">
    <div class="big-icon"><i class="fa fa-tags"></i></div>
    <h2 id="gateTitle">Memeriksa akun...</h2>
    <p class="subtitle" id="gateText"></p>
  </div>

  <!-- Panel jualan (tampil setelah login) -->
  <div id="panel" class="hidden">

    <div class="card">
      <h1>Jualan <span>Saya</span></h1>
      <p class="subtitle" id="halo"></p>
    </div>

    <!-- Form tambah / edit -->
    <div class="card hidden" id="formCard">
      <h2 id="formTitle">Tambah Produk</h2>

      <form id="produkForm" novalidate>
        <label class="field-label" for="name"><i class="fa fa-tag"></i> Nama Produk</label>
        <div class="input-box" id="nameBox">
          <i class="fa fa-shopping-bag"></i>
          <input type="text" id="name" maxlength="100" placeholder="Contoh: Sepatu Kets">
        </div>
        <p class="error" id="nameError"></p>

        <label class="field-label" for="price"><i class="fa fa-money"></i> Harga (Rupiah)</label>
        <div class="input-box" id="priceBox">
          <i class="fa fa-usd"></i>
          <input type="number" id="price" min="0" step="1" inputmode="numeric" placeholder="Contoh: 25000">
        </div>
        <p class="error" id="priceError"></p>

        <label class="field-label" for="description"><i class="fa fa-align-left"></i> Deskripsi</label>
        <div class="input-box" id="descriptionBox">
          <textarea id="description" maxlength="1000" placeholder="Ceritakan tentang produk ini"></textarea>
        </div>
        <p class="error" id="descriptionError"></p>

        <label class="field-label"><i class="fa fa-image"></i> Gambar (opsional)</label>
        <div class="preview-row">
          <div id="previewBox"></div>
          <div>
            <input type="file" id="file" class="file-input" accept="image/jpeg,image/png,image/webp">
            <p class="hint">JPG, PNG, atau WEBP. Maksimal 3 MB.</p>
            <button type="button" class="btn btn-small btn-danger hidden" id="hapusGambar">
              <i class="fa fa-trash"></i> Hapus gambar
            </button>
          </div>
        </div>
        <p class="error" id="imageError"></p>

        <p class="error" id="formError"></p>

        <div class="form-actions">
          <button type="button" class="btn" id="batalBtn">Batal</button>
          <button type="submit" class="btn btn-main" id="simpanBtn">Simpan</button>
        </div>
      </form>
    </div>

    <div class="bar">
      <h2>Daftar Produk</h2>
      <button class="btn btn-main btn-small" id="tambahBtn">
        <i class="fa fa-plus"></i> Tambah
      </button>
    </div>

    <p class="status" id="status"></p>
    <div id="daftar"></div>

  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };

  const gate = $("gate");
  const panel = $("panel");
  const formCard = $("formCard");
  const form = $("produkForm");
  const daftar = $("daftar");
  const statusBox = $("status");

  const kolom = ["name", "price", "description", "image"];
  let sedangEdit = null;      // id produk yang diedit (null = tambah baru)
  let gambarSekarang = "";    // nama file gambar yang tersimpan di produk
  let fileBaru = null;        // file yang dipilih tapi belum diupload
  let previewUrl = null;

  // ---------- util ----------
  function toast(pesan) {
    const t = $("toast");
    t.textContent = pesan;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.add("hidden"); }, 2500);
  }

  function setError(nama, pesan) {
    const err = $(nama + "Error");
    if (err) err.textContent = pesan;
    const box = $(nama + "Box");
    if (box) box.classList.toggle("invalid", pesan !== "");
  }

  function bersihkanError() {
    kolom.forEach(function (k) { setError(k, ""); });
    $("formError").textContent = "";
  }

  function rupiah(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }

  async function api(url, opsi) {
    const res = await fetch(url, opsi);
    let data = {};
    try { data = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) {
      const err = new Error(data.error || "Terjadi kesalahan.");
      err.field = data.field;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function jsonOpsi(method, body) {
    return {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
  }

  function elemenThumb(nama, alt) {
    if (nama) {
      const img = document.createElement("img");
      img.className = "thumb";
      img.alt = alt || "";
      img.src = nama.indexOf("blob:") === 0 ? nama : "/uploads/" + encodeURIComponent(nama);
      img.onerror = function () { img.replaceWith(elemenKosong()); };
      return img;
    }
    return elemenKosong();
  }

  function elemenKosong() {
    const d = document.createElement("div");
    d.className = "thumb-kosong";
    d.innerHTML = '<i class="fa fa-image"></i>';
    return d;
  }

  // ---------- cek akses ----------
  async function mulai() {
    try {
      const data = await api("/api/me");
      if (!data.user) {
        window.location.href = "signin.html";
        return;
      }
      gate.classList.add("hidden");
      panel.classList.remove("hidden");
      $("halo").textContent = "Masuk sebagai " + data.user.username + ". Produk yang kamu jual ada di sini, hanya kamu yang bisa mengubahnya.";
      muatProduk();
    } catch (e) {
      $("gateTitle").textContent = "Backend tidak terhubung";
      $("gateText").textContent =
        "Pastikan python app.py jalan di Termux dan buka lewat http://127.0.0.1:5000";
    }
  }

  // ---------- daftar produk ----------
  async function muatProduk() {
    statusBox.textContent = "Memuat produk...";
    daftar.innerHTML = "";
    try {
      const list = await api("/api/products?mine=1");
      statusBox.textContent = list.length ? "" : "Kamu belum punya produk. Klik Tambah untuk mulai jualan.";
      list.forEach(function (p) { daftar.appendChild(buatBaris(p)); });
    } catch (e) {
      statusBox.textContent = "Gagal memuat produk.";
    }
  }

  function buatBaris(p) {
    const row = document.createElement("div");
    row.className = "item";

    const info = document.createElement("div");
    info.className = "item-info";
    const nama = document.createElement("p");
    nama.className = "item-nama";
    nama.textContent = p.name;
    const harga = document.createElement("p");
    harga.className = "item-harga";
    harga.textContent = rupiah(p.price);
    info.append(nama, harga);

    const aksi = document.createElement("div");
    aksi.className = "item-actions";

    const edit = document.createElement("button");
    edit.className = "btn btn-small";
    edit.innerHTML = '<i class="fa fa-pencil"></i> Edit';
    edit.addEventListener("click", function () { bukaForm(p); });

    const hapus = document.createElement("button");
    hapus.className = "btn btn-small btn-danger";
    hapus.innerHTML = '<i class="fa fa-trash"></i> Hapus';
    hapus.addEventListener("click", function () { hapusProduk(p); });

    aksi.append(edit, hapus);
    row.append(elemenThumb(p.image, p.name), info, aksi);
    return row;
  }

  async function hapusProduk(p) {
    if (!confirm('Hapus produk "' + p.name + '"? Ini tidak bisa dibatalkan.')) return;
    try {
      await api("/api/products/" + p.id, { method: "DELETE" });
      toast("Produk dihapus.");
      muatProduk();
    } catch (e) {
      toast(e.message);
    }
  }

  // ---------- form ----------
  function tampilkanPreview() {
    const box = $("previewBox");
    box.innerHTML = "";
    const sumber = fileBaru ? previewUrl : gambarSekarang;
    box.appendChild(elemenThumb(sumber, "Pratinjau"));
    $("hapusGambar").classList.toggle("hidden", !sumber);
  }

  function bukaForm(p) {
    bersihkanError();
    sedangEdit = p ? p.id : null;
    $("formTitle").textContent = p ? "Edit Produk" : "Tambah Produk";
    $("name").value = p ? p.name : "";
    $("price").value = p ? p.price : "";
    $("description").value = p ? p.description : "";
    gambarSekarang = p ? p.image : "";
    fileBaru = null;
    $("file").value = "";
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    tampilkanPreview();
    formCard.classList.remove("hidden");
    formCard.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function tutupForm() {
    formCard.classList.add("hidden");
    sedangEdit = null;
  }

  $("tambahBtn").addEventListener("click", function () { bukaForm(null); });
  $("batalBtn").addEventListener("click", tutupForm);

  $("file").addEventListener("change", function () {
    setError("image", "");
    const f = $("file").files[0];
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) {
      setError("image", "File terlalu besar (maksimal 3 MB).");
      $("file").value = "";
      return;
    }
    if (previewUrl) URL.revokeObjectURL(previewUrl);
    fileBaru = f;
    previewUrl = URL.createObjectURL(f);
    tampilkanPreview();
  });

  $("hapusGambar").addEventListener("click", function () {
    fileBaru = null;
    gambarSekarang = "";
    $("file").value = "";
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    tampilkanPreview();
  });

  ["name", "price", "description"].forEach(function (k) {
    $(k).addEventListener("input", function () { setError(k, ""); });
  });

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    bersihkanError();

    const name = $("name").value.trim();
    const priceText = $("price").value.trim();
    const description = $("description").value.trim();
    let valid = true;

    if (!name) { setError("name", "Nama produk wajib diisi."); valid = false; }
    if (priceText === "" || !/^\d+$/.test(priceText)) {
      setError("price", "Harga harus angka bulat 0 atau lebih.");
      valid = false;
    }
    if (!valid) return;

    $("simpanBtn").disabled = true;
    try {
      let gambar = gambarSekarang;

      // Upload gambar baru dulu (kalau ada)
      if (fileBaru) {
        const fd = new FormData();
        fd.append("file", fileBaru);
        const up = await api("/api/upload", { method: "POST", body: fd });
        gambar = up.image;
      }

      const isi = {
        name: name,
        price: parseInt(priceText, 10),
        description: description,
        image: gambar
      };

      if (sedangEdit === null) {
        await api("/api/products", jsonOpsi("POST", isi));
        toast("Produk ditambahkan.");
      } else {
        await api("/api/products/" + sedangEdit, jsonOpsi("PUT", isi));
        toast("Produk diperbarui.");
      }

      tutupForm();
      muatProduk();
    } catch (e) {
      if (e.status === 401 || e.status === 403) {
        $("formError").textContent = e.message;
      } else if (e.field && $(e.field + "Error")) {
        setError(e.field, e.message);
      } else {
        $("formError").textContent = e.message;
      }
    } finally {
      $("simpanBtn").disabled = false;
    }
  });

  mulai();
</script>

</body>
</html>
