<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }

    button { font: inherit; }
    .wrap { max-width: 650px; margin: auto; }
    .hidden { display: none !important; }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }

    /* KARTU */
    .card {
      padding: 20px 18px;
      margin-bottom: 16px;
      border: 1px solid #347653;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow: 0 6px 0 #06100A, 0 14px 28px #00000060, inset 0 1px 0 #FFFFFF12;
    }
    h1 {
      margin: 0 0 6px;
      color: #F0FDF4;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }
    h2 { margin: 0 0 4px; color: #F0FDF4; font-size: 17px; }
    .subtitle { margin: 0; color: #A9BDB0; font-size: 13px; line-height: 1.6; }
    .center { text-align: center; }
    .big-icon { margin-bottom: 10px; color: #6EE7B7; font-size: 40px; }

    /* TOMBOL */
    .btn {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid #FFFFFF40;
      background: #FFFFFF10;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main {
      border: 1px solid #6EE7B7;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      box-shadow: 0 4px 0 #065F46, inset 0 1px 0 #FFFFFF90;
    }
    .btn-danger {
      border-color: #F8717180;
      background: #F8717120;
      color: #FCA5A5;
    }
    .btn-small { padding: 8px 12px; font-size: 12px; }

    /* ITEM KERANJANG */
    .item {
      display: flex;
      gap: 12px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #2D4538;
      border-radius: 14px;
      background: #131D17;
    }
    .thumb, .thumb-kosong {
      flex-shrink: 0;
      width: 70px;
      height: 70px;
      border-radius: 10px;
      object-fit: cover;
      background: #303A35;
    }
    .thumb-kosong {
      display: grid;
      place-items: center;
      color: #6EE7B7;
      font-size: 26px;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-nama {
      margin: 0;
      overflow: hidden;
      color: #F0FDF4;
      font-size: 14px;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-penjual { margin: 3px 0 0; color: #71877A; font-size: 11px; }
    .item-harga { margin: 3px 0 0; color: #6EE7B7; font-size: 12px; }
    .item-bawah {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .qty { display: flex; align-items: center; gap: 4px; }
    .qty button {
      width: 32px;
      height: 32px;
      border: 1px solid #365746;
      border-radius: 9px;
      background: #17251D;
      color: #E5F3EA;
      font-size: 16px;
      cursor: pointer;
    }
    .qty button:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty span { min-width: 28px; text-align: center; font-weight: bold; }
    .subtotal { color: #F0FDF4; font-size: 13px; font-weight: bold; }
    .item-hapus {
      padding: 6px 8px;
      border: none;
      background: transparent;
      color: #FCA5A5;
      cursor: pointer;
    }

    /* RINGKASAN */
    .total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .total-row strong { color: #6EE7B7; font-size: 20px; }
    .aksi { display: flex; gap: 10px; margin-top: 16px; }
    .aksi .btn { flex: 1; }
    .catatan { margin: 12px 0 0; color: #71877A; font-size: 11px; line-height: 1.6; text-align: center; }

    .status { margin: 14px 4px; color: #B8D2C2; font-size: 13px; text-align: center; }
    .status:empty { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: #0F2A1E;
      color: #D1FAE5;
      font-size: 13px;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px #00000080;
    }
  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <a href="orders.html" class="back"><i class="fa fa-list-alt"></i> Pesanan</a>
    <a href="welcome.html" class="back"><i class="fa fa-arrow-left"></i> Lanjut belanja</a>
  </header>

  <!-- Status awal -->
  <div class="card center" id="gate">
    <div class="big-icon"><i class="fa fa-shopping-cart"></i></div>
    <h2 id="gateTitle">Memuat keranjang...</h2>
    <p class="subtitle" id="gateText"></p>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1>Keranjang <span>Saya</span></h1>
      <p class="subtitle" id="halo"></p>
    </div>

    <div id="kosong" class="card center hidden">
      <div class="big-icon"><i class="fa fa-shopping-basket"></i></div>
      <h2>Keranjangmu masih kosong</h2>
      <p class="subtitle">Cari produk yang kamu suka, lalu masukkan ke keranjang.</p>
      <div class="aksi">
        <button class="btn btn-main" id="belanjaBtn">Mulai belanja</button>
      </div>
    </div>

    <div id="daftar"></div>

    <div class="card hidden" id="ringkasan">
      <div class="total-row">
        <span>Total (<span id="jumlahBarang">0</span> barang)</span>
        <strong id="total">Rp0</strong>
      </div>
      <div class="aksi">
        <button class="btn btn-danger" id="kosongkanBtn">
          <i class="fa fa-trash"></i> Kosongkan
        </button>
        <button class="btn btn-main" id="checkoutBtn">Checkout</button>
      </div>
      <p class="catatan">Ini simulasi: tidak ada pembayaran sungguhan. Keranjangmu tersimpan di akunmu.</p>
    </div>
  </div>

</div>

<div class="toast hidden" id="toast"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };

  function rupiah(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }

  function toast(pesan) {
    const t = $("toast");
    t.textContent = pesan;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.add("hidden"); }, 2500);
  }

  async function api(url, opsi) {
    const res = await fetch(url, opsi);
    let data = {};
    try { data = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) {
      const err = new Error(data.error || "Terjadi kesalahan.");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function jsonOpsi(method, body) {
    return {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
  }

  function elemenKosong() {
    const d = document.createElement("div");
    d.className = "thumb-kosong";
    d.innerHTML = '<i class="fa fa-image"></i>';
    return d;
  }

  function elemenThumb(nama, alt) {
    if (!nama) return elemenKosong();
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = alt || "";
    img.src = "/uploads/" + encodeURIComponent(nama);
    img.onerror = function () { img.replaceWith(elemenKosong()); };
    return img;
  }

  // ---------- tampilkan keranjang ----------
  function tampilkan(data) {
    const daftar = $("daftar");
    daftar.innerHTML = "";

    const kosong = data.items.length === 0;
    $("kosong").classList.toggle("hidden", !kosong);
    $("ringkasan").classList.toggle("hidden", kosong);
    $("halo").textContent = kosong
      ? "Belum ada barang."
      : data.count + " barang siap kamu bawa pulang.";

    data.items.forEach(function (it) { daftar.appendChild(buatItem(it)); });
    $("jumlahBarang").textContent = data.count;
    $("total").textContent = rupiah(data.total);
  }

  function buatItem(it) {
    const row = document.createElement("div");
    row.className = "item";

    const info = document.createElement("div");
    info.className = "item-info";

    const nama = document.createElement("p");
    nama.className = "item-nama";
    nama.textContent = it.name;

    const penjual = document.createElement("p");
    penjual.className = "item-penjual";
    penjual.textContent = "Penjual: " + it.seller;

    const harga = document.createElement("p");
    harga.className = "item-harga";
    harga.textContent = rupiah(it.price);

    const bawah = document.createElement("div");
    bawah.className = "item-bawah";

    const qty = document.createElement("div");
    qty.className = "qty";
    const kurang = document.createElement("button");
    kurang.textContent = "\u2212";
    kurang.setAttribute("aria-label", "Kurangi");
    kurang.disabled = it.quantity <= 1;
    const angka = document.createElement("span");
    angka.textContent = it.quantity;
    const tambah = document.createElement("button");
    tambah.textContent = "+";
    tambah.setAttribute("aria-label", "Tambah");
    tambah.disabled = it.quantity >= 99;
    qty.append(kurang, angka, tambah);

    kurang.addEventListener("click", function () { ubahJumlah(it.product_id, it.quantity - 1); });
    tambah.addEventListener("click", function () { ubahJumlah(it.product_id, it.quantity + 1); });

    const subtotal = document.createElement("span");
    subtotal.className = "subtotal";
    subtotal.textContent = rupiah(it.subtotal);

    const hapus = document.createElement("button");
    hapus.className = "item-hapus";
    hapus.setAttribute("aria-label", "Hapus dari keranjang");
    hapus.innerHTML = '<i class="fa fa-trash"></i>';
    hapus.addEventListener("click", function () { hapusItem(it); });

    bawah.append(qty, subtotal, hapus);
    info.append(nama, penjual, harga, bawah);
    row.append(elemenThumb(it.image, it.name), info);
    return row;
  }

  async function ubahJumlah(productId, jumlah) {
    if (jumlah < 1 || jumlah > 99) return;
    try {
      tampilkan(await api("/api/cart/" + productId, jsonOpsi("PATCH", { quantity: jumlah })));
    } catch (e) {
      toast(e.message);
      muat();
    }
  }

  async function hapusItem(it) {
    try {
      tampilkan(await api("/api/cart/" + it.product_id, { method: "DELETE" }));
      toast('"' + it.name + '" dihapus dari keranjang.');
    } catch (e) {
      toast(e.message);
    }
  }

  $("kosongkanBtn").addEventListener("click", async function () {
    if (!confirm("Kosongkan seluruh keranjang?")) return;
    try {
      tampilkan(await api("/api/cart", { method: "DELETE" }));
      toast("Keranjang dikosongkan.");
    } catch (e) {
      toast(e.message);
    }
  });

  $("checkoutBtn").addEventListener("click", function () {
    window.location.href = "checkout.html";
  });

  $("belanjaBtn").addEventListener("click", function () {
    window.location.href = "welcome.html";
  });

  // ---------- mulai ----------
  async function muat() {
    try {
      const me = await api("/api/me");
      if (!me.user) {
        window.location.href = "signin.html";
        return;
      }
      const data = await api("/api/cart");
      $("gate").classList.add("hidden");
      $("panel").classList.remove("hidden");
      tampilkan(data);
    } catch (e) {
      $("gateTitle").textContent = "Keranjang tidak bisa dimuat";
      $("gateText").textContent =
        "Pastikan python app.py jalan di Termux dan buka lewat http://127.0.0.1:5000";
    }
  }

  muat();
</script>

</body>
</html>
