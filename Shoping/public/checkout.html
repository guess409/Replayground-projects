<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }
    button, input, textarea { font: inherit; }
    .wrap { max-width: 650px; margin: auto; }
    .hidden { display: none !important; }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .header-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }

    /* KARTU */
    .card {
      padding: 20px 18px;
      margin-bottom: 16px;
      border: 1px solid #347653;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow: 0 6px 0 #06100A, 0 14px 28px #00000060, inset 0 1px 0 #FFFFFF12;
    }
    h1 {
      margin: 0 0 6px;
      color: #F0FDF4;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }
    h2 { margin: 0 0 4px; color: #F0FDF4; font-size: 17px; }
    h3 { margin: 0 0 10px; color: #D8E9DE; font-size: 14px; }
    .subtitle { margin: 0; color: #A9BDB0; font-size: 13px; line-height: 1.6; }
    .center { text-align: center; }
    .big-icon { margin-bottom: 10px; color: #6EE7B7; font-size: 40px; }

    /* TOMBOL */
    .btn {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid #FFFFFF40;
      background: #FFFFFF10;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main {
      border: 1px solid #6EE7B7;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      box-shadow: 0 4px 0 #065F46, inset 0 1px 0 #FFFFFF90;
    }
    .btn-main:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #065F46; }
    .btn-danger { border-color: #F8717180; background: #F8717120; color: #FCA5A5; }
    .btn-small { padding: 8px 12px; font-size: 12px; }
    .aksi { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .aksi .btn { flex: 1; min-width: 130px; }

    /* FORM */
    .field-label { display: block; margin: 15px 0 7px; color: #D8E9DE; font-size: 12px; font-weight: bold; }
    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input, .input-box textarea {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    .input-box textarea { resize: vertical; min-height: 80px; }
    .input-box:focus-within { border-color: #6EE7B7; box-shadow: 0 0 0 3px #34D39915; }
    .input-box.invalid { border-color: #F87171; box-shadow: 0 0 0 3px #F8717115; }
    input::placeholder, textarea::placeholder { color: #708779; }
    .error { min-height: 16px; margin: 6px 2px 0; color: #FCA5A5; font-size: 11px; }

    /* GAMBAR */
    .thumb, .thumb-kosong {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #303A35;
    }
    .thumb-kosong { display: grid; place-items: center; color: #6EE7B7; font-size: 22px; }

    /* STATUS PESANAN */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #FFFFFF30;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }
    .st-menunggu  { color: #FCD34D; border-color: #FCD34D66; background: #FCD34D18; }
    .st-diproses  { color: #93C5FD; border-color: #93C5FD66; background: #93C5FD18; }
    .st-dikirim   { color: #6EE7B7; border-color: #6EE7B788; background: #34D39922; }
    .st-selesai   { color: #A7F3D0; border-color: #A7F3D066; background: #10B98133; }
    .st-dibatalkan{ color: #FCA5A5; border-color: #F8717180; background: #F8717120; }

    .status { margin: 14px 4px; color: #B8D2C2; font-size: 13px; text-align: center; }
    .status:empty { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: #0F2A1E;
      color: #D1FAE5;
      font-size: 13px;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px #00000080;
    }

    .ringkas { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #2D4538; font-size: 13px; }
    .ringkas:last-child { border-bottom: none; }
    .ringkas .info { flex: 1; min-width: 0; }
    .ringkas .nama { margin: 0; overflow: hidden; color: #F0FDF4; font-weight: bold; text-overflow: ellipsis; white-space: nowrap; }
    .ringkas .sub { margin: 2px 0 0; color: #71877A; font-size: 11px; }
    .ringkas .harga { color: #D8E9DE; font-weight: bold; white-space: nowrap; }
    .kurir {
      display: flex; align-items: center; gap: 12px; width: 100%;
      padding: 12px; margin-bottom: 8px;
      border: 1px solid #344A3B; border-radius: 12px;
      background: #0C130E; color: #E5F3EA; text-align: left; cursor: pointer;
    }
    .kurir.pilih { border-color: #6EE7B7; background: #34D39914; box-shadow: 0 0 0 3px #34D39915; }
    .kurir .radio { flex-shrink: 0; width: 18px; height: 18px; border: 2px solid #5A7766; border-radius: 50%; }
    .kurir.pilih .radio { border-color: #6EE7B7; background: radial-gradient(circle, #6EE7B7 45%, transparent 50%); }
    .kurir .info { flex: 1; }
    .kurir .nama { margin: 0; font-weight: bold; font-size: 13px; }
    .kurir .est { margin: 3px 0 0; color: #A9BDB0; font-size: 11px; }
    .kurir .ongkir { color: #6EE7B7; font-weight: bold; font-size: 13px; }
    .baris { display: flex; justify-content: space-between; margin: 6px 0; font-size: 13px; color: #D8E9DE; }
    .baris.total { margin-top: 12px; padding-top: 12px; border-top: 1px solid #2D4538; font-size: 15px; font-weight: bold; }
    .baris.total strong { color: #6EE7B7; font-size: 20px; }
    .catatan { margin: 12px 0 0; color: #71877A; font-size: 11px; line-height: 1.6; text-align: center; }

  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <div class="header-links">
      <a href="cart.html" class="back"><i class="fa fa-arrow-left"></i> Keranjang</a>
    </div>
  </header>


  <div class="card center" id="gate">
    <div class="big-icon"><i class="fa fa-credit-card"></i></div>
    <h2 id="gateTitle">Menyiapkan checkout...</h2>
    <p class="subtitle" id="gateText"></p>
    <div class="aksi hidden" id="gateAksi">
      <button class="btn btn-main" id="belanjaBtn">Mulai belanja</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <h1>Check<span>out</span></h1>
      <p class="subtitle">Ini simulasi: tidak ada pembayaran atau kurir sungguhan.</p>
    </div>

    <div class="card">
      <h3><i class="fa fa-shopping-basket"></i> Barang yang dibeli</h3>
      <div id="daftarBarang"></div>
    </div>

    <form id="coForm" novalidate>
      <div class="card">
        <h3><i class="fa fa-map-marker"></i> Alamat pengiriman</h3>

        <label class="field-label" for="name">Nama penerima</label>
        <div class="input-box" id="nameBox">
          <i class="fa fa-user"></i>
          <input type="text" id="name" maxlength="60" autocomplete="name" placeholder="Nama lengkap">
        </div>
        <p class="error" id="nameError"></p>

        <label class="field-label" for="phone">Nomor HP</label>
        <div class="input-box" id="phoneBox">
          <i class="fa fa-phone"></i>
          <input type="tel" id="phone" maxlength="20" autocomplete="tel" placeholder="Contoh: 081234567890">
        </div>
        <p class="error" id="phoneError"></p>

        <label class="field-label" for="address">Alamat lengkap</label>
        <div class="input-box" id="addressBox">
          <textarea id="address" maxlength="300" autocomplete="street-address"
            placeholder="Jalan, nomor rumah, kecamatan, kota"></textarea>
        </div>
        <p class="error" id="addressError"></p>

        <label class="field-label" for="note">Catatan untuk penjual (opsional)</label>
        <div class="input-box" id="noteBox">
          <input type="text" id="note" maxlength="200" placeholder="Contoh: warna hitam ya">
        </div>
        <p class="error" id="noteError"></p>
      </div>

      <div class="card">
        <h3><i class="fa fa-truck"></i> Pilih kurir</h3>
        <div id="daftarKurir"></div>
        <p class="error" id="courierError"></p>
      </div>

      <div class="card">
        <div class="baris"><span>Subtotal barang</span><span id="subtotal">Rp0</span></div>
        <div class="baris"><span id="labelOngkir">Ongkos kirim</span><span id="ongkir">Rp0</span></div>
        <div class="baris total"><span>Total</span><strong id="total">Rp0</strong></div>
        <p class="error" id="formError"></p>
        <div class="aksi">
          <button type="submit" class="btn btn-main" id="pesanBtn">Buat Pesanan</button>
        </div>
        <p class="catatan">Barang dari penjual berbeda dipecah jadi pesanan terpisah, dengan ongkir masing-masing.</p>
      </div>
    </form>
  </div>


</div>

<div class="toast hidden" id="toast"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };

  function rupiah(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }

  function toast(pesan) {
    const t = $("toast");
    t.textContent = pesan;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.add("hidden"); }, 2600);
  }

  async function api(url, opsi) {
    const res = await fetch(url, opsi);
    let data = {};
    try { data = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) {
      const err = new Error(data.error || "Terjadi kesalahan.");
      err.field = data.field;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function jsonOpsi(method, body) {
    return {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
  }

  function elemenKosong() {
    const d = document.createElement("div");
    d.className = "thumb-kosong";
    d.innerHTML = '<i class="fa fa-image"></i>';
    return d;
  }

  function elemenThumb(nama, alt) {
    if (!nama) return elemenKosong();
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = alt || "";
    img.src = "/uploads/" + encodeURIComponent(nama);
    img.onerror = function () { img.replaceWith(elemenKosong()); };
    return img;
  }

  function waktu(t) {
    return new Date(t * 1000).toLocaleString("id-ID", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function durasi(detik) {
    if (detik < 60) return detik + " detik";
    const menit = Math.round(detik / 6) / 10;   // 1 angka di belakang koma
    return menit + " menit";
  }

  const LABEL_STATUS = {
    menunggu: "Menunggu penjual",
    diproses: "Diproses",
    dikirim: "Dalam pengiriman",
    selesai: "Selesai",
    dibatalkan: "Dibatalkan"
  };

  function badgeStatus(status) {
    const b = document.createElement("span");
    b.className = "badge st-" + status;
    b.textContent = LABEL_STATUS[status] || status;
    return b;
  }


  let keranjang = null;
  let daftarKurir = [];
  let kurirDipilih = null;
  const KOLOM = ["name", "phone", "address", "note", "courier"];

  function setError(nama, pesan) {
    const err = $(nama + "Error");
    if (err) err.textContent = pesan;
    const box = $(nama + "Box");
    if (box) box.classList.toggle("invalid", pesan !== "");
  }

  function bersihkanError() {
    KOLOM.forEach(function (k) { setError(k, ""); });
    $("formError").textContent = "";
  }

  function jumlahPenjual() {
    const set = {};
    keranjang.items.forEach(function (it) { set[String(it.seller_id)] = true; });
    return Object.keys(set).length;
  }

  function hitungTotal() {
    const grup = jumlahPenjual();
    const kurir = daftarKurir.find(function (k) { return k.id === kurirDipilih; });
    const ongkir = kurir ? kurir.ongkir * grup : 0;
    $("subtotal").textContent = rupiah(keranjang.total);
    $("labelOngkir").textContent = "Ongkos kirim" + (grup > 1 ? " (" + grup + " penjual)" : "");
    $("ongkir").textContent = kurir ? rupiah(ongkir) : "-";
    $("total").textContent = rupiah(keranjang.total + ongkir);
  }

  function tampilBarang() {
    const box = $("daftarBarang");
    box.innerHTML = "";
    keranjang.items.forEach(function (it) {
      const row = document.createElement("div");
      row.className = "ringkas";

      const info = document.createElement("div");
      info.className = "info";
      const nama = document.createElement("p");
      nama.className = "nama";
      nama.textContent = it.name;
      const sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = it.quantity + " x " + rupiah(it.price) + " · Penjual: " + it.seller;
      info.append(nama, sub);

      const harga = document.createElement("span");
      harga.className = "harga";
      harga.textContent = rupiah(it.subtotal);

      row.append(elemenThumb(it.image, it.name), info, harga);
      box.appendChild(row);
    });
  }

  function tampilKurir() {
    const box = $("daftarKurir");
    box.innerHTML = "";
    daftarKurir.forEach(function (k) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "kurir" + (k.id === kurirDipilih ? " pilih" : "");

      const radio = document.createElement("span");
      radio.className = "radio";

      const info = document.createElement("div");
      info.className = "info";
      const nama = document.createElement("p");
      nama.className = "nama";
      nama.textContent = k.nama;
      const est = document.createElement("p");
      est.className = "est";
      est.textContent = "Simulasi tiba sekitar " + durasi(k.estimasi_detik) + " setelah dikirim";
      info.append(nama, est);

      const ongkir = document.createElement("span");
      ongkir.className = "ongkir";
      ongkir.textContent = rupiah(k.ongkir);

      b.append(radio, info, ongkir);
      b.addEventListener("click", function () {
        kurirDipilih = k.id;
        setError("courier", "");
        tampilKurir();
        hitungTotal();
      });
      box.appendChild(b);
    });
  }

  $("belanjaBtn").addEventListener("click", function () { window.location.href = "welcome.html"; });

  KOLOM.forEach(function (k) {
    const el = $(k);
    if (el) el.addEventListener("input", function () { setError(k, ""); });
  });

  $("coForm").addEventListener("submit", async function (event) {
    event.preventDefault();
    bersihkanError();

    const nama = $("name").value.trim();
    const hp = $("phone").value.replace(/[\s-]/g, "");
    const alamat = $("address").value.trim();
    let valid = true;

    if (nama.length < 2) { setError("name", "Nama penerima wajib diisi."); valid = false; }
    if (!/^\+?[0-9]{8,15}$/.test(hp)) { setError("phone", "Nomor HP 8-15 angka (boleh diawali +)."); valid = false; }
    if (alamat.length < 10) { setError("address", "Alamat minimal 10 karakter, tulis selengkap mungkin."); valid = false; }
    if (!kurirDipilih) { setError("courier", "Pilih salah satu kurir."); valid = false; }
    if (!valid) return;

    $("pesanBtn").disabled = true;
    try {
      const res = await api("/api/checkout", jsonOpsi("POST", {
        name: nama,
        phone: hp,
        address: alamat,
        note: $("note").value.trim(),
        courier: kurirDipilih
      }));
      window.location.href = res.orders.length === 1
        ? "order.html?id=" + res.orders[0]
        : "orders.html";
    } catch (e) {
      if (e.field && $(e.field + "Error")) setError(e.field, e.message);
      else $("formError").textContent = e.message;
      $("pesanBtn").disabled = false;
    }
  });

  async function mulai() {
    try {
      const me = await api("/api/me");
      if (!me.user) { window.location.href = "signin.html"; return; }

      keranjang = await api("/api/cart");
      daftarKurir = await api("/api/couriers");
    } catch (e) {
      $("gateTitle").textContent = "Checkout tidak bisa dimuat";
      $("gateText").textContent = "Pastikan python app.py jalan dan buka lewat http://127.0.0.1:5000";
      return;
    }

    if (keranjang.items.length === 0) {
      $("gateTitle").textContent = "Keranjangmu masih kosong";
      $("gateText").textContent = "Masukkan barang ke keranjang dulu sebelum checkout.";
      $("gateAksi").classList.remove("hidden");
      return;
    }

    $("gate").classList.add("hidden");
    $("panel").classList.remove("hidden");
    kurirDipilih = daftarKurir.length ? daftarKurir[0].id : null;
    tampilBarang();
    tampilKurir();
    hitungTotal();
  }

  mulai();

</script>

</body>
</html>
