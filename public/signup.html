<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }

    button, input { font: inherit; }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 650px;
      margin: 0 auto 22px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }
    .back:active { transform: translateY(2px); }

    /* CARD */
    .card {
      position: relative;
      max-width: 480px;
      margin: auto;
      padding: 24px 20px;
      overflow: hidden;
      border: 1px solid #347653;
      border-radius: 22px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow:
        0 8px 0 #06100A,
        0 18px 35px #00000070,
        inset 0 1px 0 #FFFFFF12;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 4px auto 14px;
      border: 1px solid #6EE7B788;
      border-radius: 23px;
      background: linear-gradient(145deg, #34D399, #047857);
      color: #F0FDF4;
      font-size: 35px;
      transform: rotate(-5deg);
      box-shadow:
        0 7px 0 #064E3B,
        0 12px 22px #00000055,
        inset 0 2px 0 #FFFFFF70;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #F0FDF4;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }

    .subtitle {
      margin: 10px 0 10px;
      color: #A9BDB0;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    /* FORM */
    .field-label {
      display: block;
      margin: 17px 0 8px;
      color: #D8E9DE;
      font-size: 12px;
      font-weight: bold;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035, 0 2px 0 #FFFFFF05;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    input::placeholder { color: #708779; }
    .input-box:focus-within {
      border-color: #6EE7B7;
      box-shadow: 0 0 0 3px #34D39915;
    }
    .input-box.invalid {
      border-color: #F87171;
      box-shadow: 0 0 0 3px #F8717115;
    }

    .toggle-pass {
      flex-shrink: 0;
      padding: 8px;
      border: none;
      background: transparent;
      color: #91A99B;
      cursor: pointer;
    }
    .toggle-pass:hover { color: #6EE7B7; }

    .error {
      min-height: 16px;
      margin: 6px 2px 0;
      color: #FCA5A5;
      font-size: 11px;
    }

    .send-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 5px 0 #065F46,
        0 9px 16px #00000035,
        inset 0 1px 0 #FFFFFF90;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .send-button i { margin-left: 7px; }
    .send-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #065F46;
    }

    .switch {
      margin: 22px 0 0;
      color: #A9BDB0;
      font-size: 12px;
      text-align: center;
    }
    .switch a {
      color: #6EE7B7;
      font-weight: bold;
      text-decoration: none;
    }


    /* KEKUATAN PASSWORD */
    .strength {
      height: 6px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 6px;
      background: #0C130E;
      border: 1px solid #344A3B;
    }
    .strength-bar {
      width: 0;
      height: 100%;
      border-radius: 6px;
      background: #F87171;
      transition: width 0.2s, background 0.2s;
    }
    .strength-text {
      margin: 6px 2px 0;
      color: #91A99B;
      font-size: 11px;
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .footer {
      margin-top: 22px;
      color: #71877A;
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 380px) {
      body { padding: 12px; }
      .card { padding: 20px 15px; }
      .brand { font-size: 14px; }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <a href="welcome.html" class="back">
      <i class="fa fa-arrow-left"></i> Kembali
    </a>
  </header>

  <main class="card">

    <div class="icon"><i class="fa fa-user-plus"></i></div>

    <h1>Sign <span>Up</span></h1>
    <p class="subtitle">Buat akun ReyMarket gratis dalam semenit.</p>

    <form id="signupForm" novalidate>

      <label class="field-label" for="username">
        <i class="fa fa-user"></i> Nama Pengguna
      </label>
      <div class="input-box" id="usernameBox">
        <i class="fa fa-id-badge"></i>
        <input type="text" id="username" name="username"
          placeholder="Contoh: rehan"
          autocomplete="username" maxlength="20" required>
      </div>
      <p class="error" id="usernameError"></p>

      <label class="field-label" for="email">
        <i class="fa fa-envelope"></i> Alamat Email
      </label>
      <div class="input-box" id="emailBox">
        <i class="fa fa-at"></i>
        <input type="email" id="email" name="email"
          placeholder="Masukkan email kamu"
          autocomplete="email" required>
      </div>
      <p class="error" id="emailError"></p>

      <label class="field-label" for="password">
        <i class="fa fa-lock"></i> Password
      </label>
      <div class="input-box" id="passwordBox">
        <i class="fa fa-key"></i>
        <input type="password" id="password" name="password"
          placeholder="Minimal 8 karakter"
          autocomplete="new-password" required>
        <button type="button" class="toggle-pass" data-target="password"
          aria-label="Tampilkan password">
          <i class="fa fa-eye"></i>
        </button>
      </div>
      <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
      <p class="strength-text" id="strengthText">Kekuatan password: -</p>
      <p class="error" id="passwordError"></p>

      <label class="field-label" for="confirm">
        <i class="fa fa-check-circle"></i> Ulangi Password
      </label>
      <div class="input-box" id="confirmBox">
        <i class="fa fa-key"></i>
        <input type="password" id="confirm" name="confirm"
          placeholder="Ketik ulang password"
          autocomplete="new-password" required>
        <button type="button" class="toggle-pass" data-target="confirm"
          aria-label="Tampilkan password">
          <i class="fa fa-eye"></i>
        </button>
      </div>
      <p class="error" id="confirmError"></p>

      <p class="error" id="formError"></p>

      <button type="submit" class="send-button" id="submitBtn">
        Buat Akun <i class="fa fa-arrow-right"></i>
      </button>

    </form>

    <p class="switch">
      Sudah punya akun? <a href="signin.html">Sign In</a>
    </p>

  </main>

  <footer class="footer">
    REYMARKET<br>
    Belanja simpel, nyaman.
  </footer>

  <script>
    const form = document.getElementById("signupForm");

    const fields = {
      username: {
        input: document.getElementById("username"),
        box: document.getElementById("usernameBox"),
        error: document.getElementById("usernameError")
      },
      email: {
        input: document.getElementById("email"),
        box: document.getElementById("emailBox"),
        error: document.getElementById("emailError")
      },
      password: {
        input: document.getElementById("password"),
        box: document.getElementById("passwordBox"),
        error: document.getElementById("passwordError")
      },
      confirm: {
        input: document.getElementById("confirm"),
        box: document.getElementById("confirmBox"),
        error: document.getElementById("confirmError")
      }
    };

    const strengthBar = document.getElementById("strengthBar");
    const strengthText = document.getElementById("strengthText");

    function setError(name, message) {
      const f = fields[name];
      f.error.textContent = message;
      f.box.classList.toggle("invalid", message !== "");
    }

    // Hapus error saat user mengetik lagi
    Object.keys(fields).forEach(function (name) {
      fields[name].input.addEventListener("input", function () {
        setError(name, "");
      });
    });

    // Tampilkan / sembunyikan password (untuk kedua kolom password)
    document.querySelectorAll(".toggle-pass").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const input = document.getElementById(btn.dataset.target);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.querySelector("i").className =
          hidden ? "fa fa-eye-slash" : "fa fa-eye";
        btn.setAttribute(
          "aria-label",
          hidden ? "Sembunyikan password" : "Tampilkan password"
        );
      });
    });

    // Indikator kekuatan password
    function checkStrength(pw) {
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
      if (/\d/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      return score; // 0 - 5
    }

    fields.password.input.addEventListener("input", function () {
      const pw = fields.password.input.value;

      if (!pw) {
        strengthBar.style.width = "0";
        strengthText.textContent = "Kekuatan password: -";
        return;
      }

      const score = checkStrength(pw);
      let label = "Lemah";
      let color = "#F87171";

      if (score >= 4) {
        label = "Kuat";
        color = "#34D399";
      } else if (score >= 3) {
        label = "Sedang";
        color = "#FBBF24";
      }

      strengthBar.style.width = (score / 5) * 100 + "%";
      strengthBar.style.background = color;
      strengthText.textContent = "Kekuatan password: " + label;
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = fields.username.input.value.trim();
      const email = fields.email.input.value.trim();
      const password = fields.password.input.value;
      const confirm = fields.confirm.input.value;
      let valid = true;

      if (!username) {
        setError("username", "Nama pengguna wajib diisi.");
        valid = false;
      } else if (username.length < 3) {
        setError("username", "Minimal 3 karakter.");
        valid = false;
      } else if (!/^[A-Za-z0-9_]+$/.test(username)) {
        setError("username", "Hanya huruf, angka, dan garis bawah (_).");
        valid = false;
      }

      if (!email) {
        setError("email", "Email wajib diisi.");
        valid = false;
      } else if (!fields.email.input.checkValidity()) {
        setError("email", "Format email belum benar.");
        valid = false;
      }

      if (!password) {
        setError("password", "Password wajib diisi.");
        valid = false;
      } else if (password.length < 8) {
        setError("password", "Password minimal 8 karakter.");
        valid = false;
      }

      if (!confirm) {
        setError("confirm", "Ketik ulang password kamu.");
        valid = false;
      } else if (confirm !== password) {
        setError("confirm", "Password tidak sama.");
        valid = false;
      }

      if (!valid) return;

      kirimDaftar(username, email, password);
    });

    const formError = document.getElementById("formError");
    const submitBtn = document.getElementById("submitBtn");

    async function kirimDaftar(username, email, password) {
      formError.textContent = "";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password
          })
        });
        const data = await res.json();

        if (!res.ok) {
          // Server bisa menunjuk kolom yang bermasalah (username/email/password)
          if (data.field && fields[data.field]) {
            setError(data.field, data.error);
          } else {
            formError.textContent = data.error || "Pendaftaran gagal.";
          }
          return;
        }

        window.location.href = "welcome.html";
      } catch (err) {
        formError.textContent =
          "Tidak bisa terhubung ke backend. " +
          "Pastikan python app.py jalan dan buka lewat http://127.0.0.1:5000";
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
