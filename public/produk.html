<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Produk - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }
    button, input, textarea { font: inherit; }
    .wrap { max-width: 650px; margin: auto; }
    .hidden { display: none !important; }

    /* HEADER */
    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .header-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }

    /* KARTU */
    .card {
      padding: 20px 18px;
      margin-bottom: 16px;
      border: 1px solid #347653;
      border-radius: 20px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow: 0 6px 0 #06100A, 0 14px 28px #00000060, inset 0 1px 0 #FFFFFF12;
    }
    h1 {
      margin: 0 0 6px;
      color: #F0FDF4;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }
    h2 { margin: 0 0 4px; color: #F0FDF4; font-size: 17px; }
    h3 { margin: 0 0 10px; color: #D8E9DE; font-size: 14px; }
    .subtitle { margin: 0; color: #A9BDB0; font-size: 13px; line-height: 1.6; }
    .center { text-align: center; }
    .big-icon { margin-bottom: 10px; color: #6EE7B7; font-size: 40px; }

    /* TOMBOL */
    .btn {
      padding: 12px 16px;
      border-radius: 11px;
      border: 1px solid #FFFFFF40;
      background: #FFFFFF10;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-main {
      border: 1px solid #6EE7B7;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      box-shadow: 0 4px 0 #065F46, inset 0 1px 0 #FFFFFF90;
    }
    .btn-main:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #065F46; }
    .btn-danger { border-color: #F8717180; background: #F8717120; color: #FCA5A5; }
    .btn-small { padding: 8px 12px; font-size: 12px; }
    .aksi { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .aksi .btn { flex: 1; min-width: 130px; }

    /* FORM */
    .field-label { display: block; margin: 15px 0 7px; color: #D8E9DE; font-size: 12px; font-weight: bold; }
    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input, .input-box textarea {
      width: 100%;
      min-width: 0;
      padding: 13px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    .input-box textarea { resize: vertical; min-height: 80px; }
    .input-box:focus-within { border-color: #6EE7B7; box-shadow: 0 0 0 3px #34D39915; }
    .input-box.invalid { border-color: #F87171; box-shadow: 0 0 0 3px #F8717115; }
    input::placeholder, textarea::placeholder { color: #708779; }
    .error { min-height: 16px; margin: 6px 2px 0; color: #FCA5A5; font-size: 11px; }

    /* GAMBAR */
    .thumb, .thumb-kosong {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 10px;
      object-fit: cover;
      background: #303A35;
    }
    .thumb-kosong { display: grid; place-items: center; color: #6EE7B7; font-size: 22px; }

    /* STATUS PESANAN */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #FFFFFF30;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }
    .st-menunggu  { color: #FCD34D; border-color: #FCD34D66; background: #FCD34D18; }
    .st-diproses  { color: #93C5FD; border-color: #93C5FD66; background: #93C5FD18; }
    .st-dikirim   { color: #6EE7B7; border-color: #6EE7B788; background: #34D39922; }
    .st-selesai   { color: #A7F3D0; border-color: #A7F3D066; background: #10B98133; }
    .st-dibatalkan{ color: #FCA5A5; border-color: #F8717180; background: #F8717120; }

    .status { margin: 14px 4px; color: #B8D2C2; font-size: 13px; text-align: center; }
    .status:empty { display: none; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 10;
      max-width: 90%;
      padding: 12px 16px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: #0F2A1E;
      color: #D1FAE5;
      font-size: 13px;
      transform: translateX(-50%);
      box-shadow: 0 8px 20px #00000080;
    }

    .foto {
      width: 100%;
      aspect-ratio: 4 / 3;
      margin-bottom: 16px;
      overflow: hidden;
      border-radius: 14px;
      background: #303A35;
    }
    .foto img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .foto .kosong { display: grid; place-items: center; width: 100%; height: 100%; color: #6EE7B7; font-size: 56px; }
    .harga { margin: 4px 0 0; color: #6EE7B7; font-size: 24px; font-weight: 900; }
    .penjual { margin: 8px 0 0; color: #A9BDB0; font-size: 12px; }
    .deskripsi { margin: 14px 0 0; color: #D8E9DE; font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .qty-row { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
    .qty-row > span { color: #D8E9DE; font-size: 13px; font-weight: bold; }
    .qty { display: flex; align-items: center; gap: 4px; }
    .qty button {
      width: 36px; height: 36px;
      border: 1px solid #365746; border-radius: 9px;
      background: #17251D; color: #E5F3EA; font-size: 18px; cursor: pointer;
    }
    .qty button:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty .angka { min-width: 34px; text-align: center; font-weight: bold; }
    .milik-sendiri { margin: 16px 0 0; padding: 12px; border: 1px dashed #365746; border-radius: 12px; color: #A9BDB0; font-size: 12px; line-height: 1.6; }
    .milik-sendiri a { color: #6EE7B7; }

  </style>
</head>

<body>
<div class="wrap">

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <div class="header-links">
      <a href="cart.html" class="back"><i class="fa fa-shopping-cart"></i> Keranjang</a>
      <a href="welcome.html" class="back"><i class="fa fa-arrow-left"></i> Beranda</a>
    </div>
  </header>


  <div class="card center" id="gate">
    <div class="big-icon"><i class="fa fa-shopping-bag"></i></div>
    <h2 id="gateTitle">Memuat produk...</h2>
    <p class="subtitle" id="gateText"></p>
    <div class="aksi hidden" id="gateAksi">
      <button class="btn btn-main" id="kembaliBtn">Kembali ke beranda</button>
    </div>
  </div>

  <div id="panel" class="card hidden">
    <div class="foto" id="foto"></div>
    <h1 id="nama"></h1>
    <p class="harga" id="harga"></p>
    <p class="penjual" id="penjual"></p>
    <p class="deskripsi" id="deskripsi"></p>

    <div id="beliBox">
      <div class="qty-row">
        <span>Jumlah</span>
        <div class="qty">
          <button id="kurang" aria-label="Kurangi">&minus;</button>
          <span class="angka" id="angka">1</span>
          <button id="tambah" aria-label="Tambah">+</button>
        </div>
      </div>
      <div class="aksi">
        <button class="btn" id="keranjangBtn"><i class="fa fa-cart-plus"></i> Masukkan keranjang</button>
        <button class="btn btn-main" id="beliBtn">Beli sekarang</button>
      </div>
    </div>

    <p class="milik-sendiri hidden" id="milikSendiri">
      Ini produk milikmu. Kamu bisa mengubahnya di
      <a href="jual.html">Jualan Saya</a>.
    </p>
  </div>


</div>

<div class="toast hidden" id="toast"></div>

<script>
  const $ = function (id) { return document.getElementById(id); };

  function rupiah(n) { return "Rp" + Number(n).toLocaleString("id-ID"); }

  function toast(pesan) {
    const t = $("toast");
    t.textContent = pesan;
    t.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.classList.add("hidden"); }, 2600);
  }

  async function api(url, opsi) {
    const res = await fetch(url, opsi);
    let data = {};
    try { data = await res.json(); } catch (e) { /* bukan JSON */ }
    if (!res.ok) {
      const err = new Error(data.error || "Terjadi kesalahan.");
      err.field = data.field;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function jsonOpsi(method, body) {
    return {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    };
  }

  function elemenKosong() {
    const d = document.createElement("div");
    d.className = "thumb-kosong";
    d.innerHTML = '<i class="fa fa-image"></i>';
    return d;
  }

  function elemenThumb(nama, alt) {
    if (!nama) return elemenKosong();
    const img = document.createElement("img");
    img.className = "thumb";
    img.alt = alt || "";
    img.src = "/uploads/" + encodeURIComponent(nama);
    img.onerror = function () { img.replaceWith(elemenKosong()); };
    return img;
  }

  function waktu(t) {
    return new Date(t * 1000).toLocaleString("id-ID", {
      day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
  }

  function durasi(detik) {
    if (detik < 60) return detik + " detik";
    const menit = Math.round(detik / 6) / 10;   // 1 angka di belakang koma
    return menit + " menit";
  }

  const LABEL_STATUS = {
    menunggu: "Menunggu penjual",
    diproses: "Diproses",
    dikirim: "Dalam pengiriman",
    selesai: "Selesai",
    dibatalkan: "Dibatalkan"
  };

  function badgeStatus(status) {
    const b = document.createElement("span");
    b.className = "badge st-" + status;
    b.textContent = LABEL_STATUS[status] || status;
    return b;
  }


  let produk = null;
  let pengguna = null;
  let jumlah = 1;

  function tampilGagal(judul, teks) {
    $("gateTitle").textContent = judul;
    $("gateText").textContent = teks;
    $("gateAksi").classList.remove("hidden");
  }

  function tampilFoto(nama, alt) {
    const box = $("foto");
    box.innerHTML = "";
    const kosong = function () {
      const d = document.createElement("div");
      d.className = "kosong";
      d.innerHTML = '<i class="fa fa-image"></i>';
      return d;
    };
    if (!nama) { box.appendChild(kosong()); return; }
    const img = document.createElement("img");
    img.alt = alt;
    img.src = "/uploads/" + encodeURIComponent(nama);
    img.onerror = function () { img.replaceWith(kosong()); };
    box.appendChild(img);
  }

  function aturJumlah(n) {
    jumlah = Math.min(99, Math.max(1, n));
    $("angka").textContent = jumlah;
    $("kurang").disabled = jumlah <= 1;
    $("tambah").disabled = jumlah >= 99;
  }

  async function masukkan(lanjut) {
    if (!pengguna) { window.location.href = "signin.html"; return; }
    $("keranjangBtn").disabled = true;
    $("beliBtn").disabled = true;
    try {
      await api("/api/cart", jsonOpsi("POST", { product_id: produk.id, quantity: jumlah }));
      if (lanjut) {
        window.location.href = "checkout.html";
        return;
      }
      toast(jumlah + " x \"" + produk.name + "\" masuk keranjang.");
    } catch (e) {
      toast(e.message);
    } finally {
      $("keranjangBtn").disabled = false;
      $("beliBtn").disabled = false;
    }
  }

  $("kurang").addEventListener("click", function () { aturJumlah(jumlah - 1); });
  $("tambah").addEventListener("click", function () { aturJumlah(jumlah + 1); });
  $("keranjangBtn").addEventListener("click", function () { masukkan(false); });
  $("beliBtn").addEventListener("click", function () { masukkan(true); });
  $("kembaliBtn").addEventListener("click", function () { window.location.href = "welcome.html"; });

  async function mulai() {
    const id = parseInt(new URLSearchParams(window.location.search).get("id"), 10);
    if (!id) { tampilGagal("Produk tidak ditemukan", "Alamat halaman ini kurang lengkap."); return; }

    try {
      const me = await api("/api/me");
      pengguna = me.user;
      produk = await api("/api/products/" + id);
    } catch (e) {
      if (e.status === 404) {
        tampilGagal("Produk tidak ditemukan", "Mungkin produk ini sudah dihapus penjualnya.");
      } else {
        tampilGagal("Tidak bisa memuat produk",
          "Pastikan python app.py jalan dan buka lewat http://127.0.0.1:5000");
      }
      return;
    }

    document.title = produk.name + " - ReyMarket";
    $("gate").classList.add("hidden");
    $("panel").classList.remove("hidden");
    tampilFoto(produk.image, produk.name);
    $("nama").textContent = produk.name;
    $("harga").textContent = rupiah(produk.price);
    $("penjual").textContent = "Dijual oleh " + produk.seller;
    $("deskripsi").textContent = produk.description || "Penjual belum menambahkan deskripsi.";
    aturJumlah(1);

    if (pengguna && produk.seller_id === pengguna.id) {
      $("beliBox").classList.add("hidden");
      $("milikSendiri").classList.remove("hidden");
    }
  }

  mulai();

</script>

</body>
</html>
