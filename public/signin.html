<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - ReyMarket</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding: 18px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #E5F3EA;
      background:
        radial-gradient(ellipse at top, #193D2D, transparent 55%),
        linear-gradient(145deg, #101713, #080B09);
    }

    button, input { font: inherit; }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 650px;
      margin: 0 auto 22px;
    }
    .brand {
      color: #F0FDF4;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      text-decoration: none;
    }
    .brand span { color: #6EE7B7; }
    .back {
      padding: 10px 13px;
      border: 1px solid #365746;
      border-radius: 10px;
      background: #17251D;
      color: #C5E8D2;
      text-decoration: none;
      font-size: 12px;
    }
    .back:active { transform: translateY(2px); }

    /* CARD */
    .card {
      position: relative;
      max-width: 480px;
      margin: auto;
      padding: 24px 20px;
      overflow: hidden;
      border: 1px solid #347653;
      border-radius: 22px;
      background:
        radial-gradient(circle at 100% 0%, #34D39920, transparent 38%),
        linear-gradient(145deg, #1B2921, #111914 75%);
      box-shadow:
        0 8px 0 #06100A,
        0 18px 35px #00000070,
        inset 0 1px 0 #FFFFFF12;
    }

    .icon {
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      margin: 4px auto 14px;
      border: 1px solid #6EE7B788;
      border-radius: 23px;
      background: linear-gradient(145deg, #34D399, #047857);
      color: #F0FDF4;
      font-size: 35px;
      transform: rotate(-5deg);
      box-shadow:
        0 7px 0 #064E3B,
        0 12px 22px #00000055,
        inset 0 2px 0 #FFFFFF70;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #F0FDF4;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 900;
      letter-spacing: -1px;
    }
    h1 span { color: #6EE7B7; }

    .subtitle {
      margin: 10px 0 10px;
      color: #A9BDB0;
      font-size: 13px;
      line-height: 1.7;
      text-align: center;
    }

    /* FORM */
    .field-label {
      display: block;
      margin: 17px 0 8px;
      color: #D8E9DE;
      font-size: 12px;
      font-weight: bold;
    }

    .input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 13px;
      border: 1px solid #344A3B;
      border-radius: 12px;
      background: #0C130E;
      box-shadow: inset 0 3px 7px #00000035, 0 2px 0 #FFFFFF05;
    }
    .input-box > i { color: #6EE7B7; }
    .input-box input {
      width: 100%;
      min-width: 0;
      padding: 14px 0;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 13px;
    }
    input::placeholder { color: #708779; }
    .input-box:focus-within {
      border-color: #6EE7B7;
      box-shadow: 0 0 0 3px #34D39915;
    }
    .input-box.invalid {
      border-color: #F87171;
      box-shadow: 0 0 0 3px #F8717115;
    }

    .toggle-pass {
      flex-shrink: 0;
      padding: 8px;
      border: none;
      background: transparent;
      color: #91A99B;
      cursor: pointer;
    }
    .toggle-pass:hover { color: #6EE7B7; }

    .error {
      min-height: 16px;
      margin: 6px 2px 0;
      color: #FCA5A5;
      font-size: 11px;
    }

    .send-button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 1px solid #6EE7B7;
      border-radius: 12px;
      background: linear-gradient(180deg, #6EE7B7, #10B981);
      color: #052E22;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow:
        0 5px 0 #065F46,
        0 9px 16px #00000035,
        inset 0 1px 0 #FFFFFF90;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .send-button i { margin-left: 7px; }
    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .send-button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #065F46;
    }

    .switch {
      margin: 22px 0 0;
      color: #A9BDB0;
      font-size: 12px;
      text-align: center;
    }
    .switch a {
      color: #6EE7B7;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      margin-top: 22px;
      color: #71877A;
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 380px) {
      body { padding: 12px; }
      .card { padding: 20px 15px; }
      .brand { font-size: 14px; }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="welcome.html" class="brand">REY<span>MARKET</span></a>
    <a href="welcome.html" class="back">
      <i class="fa fa-arrow-left"></i> Kembali
    </a>
  </header>

  <main class="card">

    <div class="icon"><i class="fa fa-user"></i></div>

    <h1>Sign <span>In</span></h1>
    <p class="subtitle">Masuk untuk lanjut belanja di ReyMarket.</p>

    <form id="signinForm" novalidate>

      <label class="field-label" for="email">
        <i class="fa fa-envelope"></i> Alamat Email
      </label>
      <div class="input-box" id="emailBox">
        <i class="fa fa-at"></i>
        <input type="email" id="email" name="email"
          placeholder="Masukkan email kamu"
          autocomplete="email" required>
      </div>
      <p class="error" id="emailError"></p>

      <label class="field-label" for="password">
        <i class="fa fa-lock"></i> Password
      </label>
      <div class="input-box" id="passwordBox">
        <i class="fa fa-key"></i>
        <input type="password" id="password" name="password"
          placeholder="Masukkan password"
          autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="togglePass"
          aria-label="Tampilkan password">
          <i class="fa fa-eye"></i>
        </button>
      </div>
      <p class="error" id="passwordError"></p>

      <p class="error" id="formError"></p>

      <button type="submit" class="send-button" id="submitBtn">
        Masuk <i class="fa fa-sign-in"></i>
      </button>

    </form>

    <p class="switch">
      Belum punya akun? <a href="signup.html">Sign Up</a>
    </p>

  </main>

  <footer class="footer">
    REYMARKET<br>
    Belanja simpel, nyaman.
  </footer>

  <script>
    const form = document.getElementById("signinForm");
    const emailInput = document.getElementById("email");
    const passInput = document.getElementById("password");
    const emailBox = document.getElementById("emailBox");
    const passBox = document.getElementById("passwordBox");
    const emailError = document.getElementById("emailError");
    const passError = document.getElementById("passwordError");
    const togglePass = document.getElementById("togglePass");

    // Tampilkan / sembunyikan password
    togglePass.addEventListener("click", function () {
      const hidden = passInput.type === "password";
      passInput.type = hidden ? "text" : "password";
      togglePass.querySelector("i").className =
        hidden ? "fa fa-eye-slash" : "fa fa-eye";
      togglePass.setAttribute(
        "aria-label",
        hidden ? "Sembunyikan password" : "Tampilkan password"
      );
    });

    function setError(box, errorEl, message) {
      errorEl.textContent = message;
      box.classList.toggle("invalid", message !== "");
    }

    // Hapus pesan error saat user mengetik lagi
    emailInput.addEventListener("input", function () {
      setError(emailBox, emailError, "");
    });
    passInput.addEventListener("input", function () {
      setError(passBox, passError, "");
    });

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passInput.value;
      let valid = true;

      if (!email) {
        setError(emailBox, emailError, "Email wajib diisi.");
        valid = false;
      } else if (!emailInput.checkValidity()) {
        setError(emailBox, emailError, "Format email belum benar.");
        valid = false;
      }

      if (!password) {
        setError(passBox, passError, "Password wajib diisi.");
        valid = false;
      }

      if (!valid) return;

      kirimLogin(email, password);
    });

    const formError = document.getElementById("formError");
    const submitBtn = document.getElementById("submitBtn");

    async function kirimLogin(email, password) {
      formError.textContent = "";
      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, password: password })
        });
        const data = await res.json();

        if (!res.ok) {
          formError.textContent = data.error || "Login gagal.";
          return;
        }

        window.location.href = "welcome.html";
      } catch (err) {
        formError.textContent =
          "Tidak bisa terhubung ke backend. " +
          "Pastikan python app.py jalan dan buka lewat http://127.0.0.1:5000";
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
